name: Deployment Pipeline

on:
  push:
    branches:
      - develop

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.5'

      - name: Install Dependencies
        run: go mod tidy

      - name: Run Tests
        run: go test ./... -v

      - name: Build Project
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server main.go
          ls -lah
      
      - name: Copy Binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "server"
          target: "/home/ubuntu/tasksy-server"

      - name: Restart Systemd Service on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart tasksy-server.service
            sudo systemctl status tasksy-server.service --no-pager