name: Deployment Pipeline

on:
  push:
    branches:
      - develop

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test ./... -v

      - name: Build Project
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server main.go
          ls -lah
      
      - name: Copy Binary to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "tasksy-server"
          target: "/home/ubuntu/" 

      - name: Restart Systemd Service on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # 1. Move binary to final location (optional, keeps home clean)
          # 2. Give it executable permissions
          # 3. Restart service
          script: |
            mv /home/ubuntu/tasksy-server /home/ubuntu/tasksy-server-bin
            chmod +x /home/ubuntu/tasksy-server-bin
            sudo systemctl restart tasksy-server.service
            sudo systemctl status tasksy-server.service --no-pager