name: Deployment Pipeline

on:
  push:
    branches:
      - working
      # - deployment

# Cancel any in-flight deployment for the same branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build Go binaries and deploy to VPS
  # ─────────────────────────────────────────────────────────────
  deploy-backend:
    name: Build & Deploy Go Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build binaries (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server ./cmd/api/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o worker ./cmd/worker/main.go
          ls -lah server worker

      - name: Copy binaries to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "server,worker"
          target: "/home/ubuntu/"

      - name: Restart backend services
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Atomic swap: move new binaries into place
            mv /home/ubuntu/server /home/ubuntu/tasksy-server/server
            chmod +x /home/ubuntu/tasksy-server/server

            mv /home/ubuntu/worker /home/ubuntu/tasksy-server/worker
            chmod +x /home/ubuntu/tasksy-server/worker

            sudo systemctl daemon-reload
            sudo systemctl restart tasksy-server.service
            sudo systemctl restart tasksy-worker.service

            # Wait a moment and verify both services are active
            sleep 3
            sudo systemctl is-active --quiet tasksy-server.service && echo "[ok] tasksy-server running" || (echo "[fail] tasksy-server failed to start" && sudo journalctl -u tasksy-server.service -n 30 --no-pager && exit 1)
            sudo systemctl is-active --quiet tasksy-worker.service && echo "[ok] tasksy-worker running" || (echo "[fail] tasksy-worker failed to start" && sudo journalctl -u tasksy-worker.service -n 30 --no-pager && exit 1)

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build Next.js admin panel and deploy to VPS
  #         Runs after backend is confirmed healthy
  # ─────────────────────────────────────────────────────────────
  deploy-admin:
    name: Build & Deploy Next.js Admin Panel
    runs-on: ubuntu-latest
    needs: deploy-backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install admin dependencies
        working-directory: admin
        run: npm ci --prefer-offline

      - name: Build admin panel (standalone output)
        working-directory: admin
        env:
          # The VPS-internal URL Next.js rewrites proxy to at runtime
          BACKEND_URL: http://localhost:5000
          NODE_ENV: production
        run: npm run build

      - name: Package standalone build
        run: |
          # Next.js standalone doesn't include static/public — copy them in
          cp -r admin/.next/static admin/.next/standalone/.next/static

          # Only copy public if it exists and has files
          if [ -d "admin/public" ] && [ "$(ls -A admin/public)" ]; then
            cp -r admin/public admin/.next/standalone/public
          fi

          tar -czf admin-build.tar.gz -C admin/.next/standalone .
          echo "Archive size: $(du -sh admin-build.tar.gz | cut -f1)"

      - name: Copy admin build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          source: "admin-build.tar.gz"
          target: "/home/ubuntu/"

      - name: Deploy admin panel on VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Stop first — frees the port and prevents MODULE_NOT_FOUND from
            # tar extracting over files that the running process has open
            sudo systemctl stop tasksy-admin.service || true

            mkdir -p /home/ubuntu/tasksy-admin
            tar -xzf /home/ubuntu/admin-build.tar.gz -C /home/ubuntu/tasksy-admin
            rm /home/ubuntu/admin-build.tar.gz

            sudo systemctl daemon-reload
            sudo systemctl start tasksy-admin.service

            # Verify it came up
            sleep 3
            sudo systemctl is-active --quiet tasksy-admin.service && echo "[ok] tasksy-admin running" || (echo "[fail] tasksy-admin failed to start" && sudo journalctl -u tasksy-admin.service -n 30 --no-pager && exit 1)
