upstream tasksy_admin {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name 13.60.208.3 localhost 127.0.0.1;

    client_max_body_size 20M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy everything to Next.js — it serves its own static assets.
    # Do NOT alias /_next/static/ directly: Nginx www-data lacks read
    # access to /home/ubuntu/ and returns 403 on all JS/CSS files.
    location / {
        proxy_pass http://tasksy_admin;

        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
