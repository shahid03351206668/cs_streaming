# Nginx configuration for Tasksy Admin Panel (Next.js)
#
# Prerequisites:
#   1. Replace "admin.yourdomain.com" with your actual domain/subdomain.
#   2. Symlink this file:
#        sudo ln -s /etc/nginx/sites-available/tasksy-admin.conf \
#                   /etc/nginx/sites-enabled/tasksy-admin.conf
#   3. Test: sudo nginx -t
#   4. Reload: sudo systemctl reload nginx
#
# For HTTPS, run: sudo certbot --nginx -d admin.yourdomain.com

upstream tasksy_admin {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name 13.60.208.3;   # <-- replace with your domain

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve Next.js immutable static assets directly from Nginx
    # (these are fingerprinted by hash so a 1-year TTL is safe)
    location /_next/static/ {
        alias /home/ubuntu/tasksy-admin/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve public/ directory assets directly
    location /public/ {
        alias /home/ubuntu/tasksy-admin/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy everything else (pages, API rewrites, WebSocket upgrades) to Next.js
    location / {
        proxy_pass http://tasksy_admin;

        proxy_http_version 1.1;

        # WebSocket support (needed for hot-reload in dev; harmless in prod)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;

        # Timeouts (Next.js SSR can take a moment on first render)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Optional: increase body size limit for file uploads through admin
    client_max_body_size 20M;
}
